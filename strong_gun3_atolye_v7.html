<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strong · Gün 3 SAHA · Müşteri Önceliği Atölyesi</title>
<style>
:root{--navy:#0A1240;--navy2:#101F6B;--blue:#2557D6;--sky:#9DBBFF;--bg:#F4F6FA;--amber:#F2A33A;--teal:#0F766E;--red:#B42318;--ink:#1F2937;--mut:#5B6577;--line:#DCE2EE}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;line-height:1.45;font-size:15px}
h1,h2,h3,.serif{font-family:Cambria,Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}

/* ---------- Kapak ---------- */
.cover{min-height:100vh;background:var(--navy);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:calc(40px + env(safe-area-inset-top)) 28px calc(90px + env(safe-area-inset-bottom))}
.cover::before{content:"";position:absolute;right:-140px;top:-140px;width:520px;height:520px;border-radius:50%;background:var(--navy2)}
.cover .in{position:relative;max-width:760px;margin:0 auto;width:100%}
.cover .eyebrow{color:var(--sky)}
.cover h1{color:#fff;font-size:42px;line-height:1.12;margin:12px 0 14px}
.cover p.lead{color:#D5DEF7;font-size:17px;max-width:620px;margin:0 0 22px}
.cover .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.cover .tag{background:rgba(255,255,255,.1);border:1px solid rgba(157,187,255,.4);border-radius:999px;padding:6px 14px;font-size:13px}
.cover .tag.m{background:var(--amber);color:var(--navy);border-color:var(--amber);font-weight:700}
.cover .priv{font-size:13px;color:#B9C6EA;max-width:560px;margin:22px 0 0}
.cover .logos{position:absolute;left:28px;right:28px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}
.cover .logos img{height:30px;width:auto}

/* ---------- Kabuk ---------- */
.shell{max-width:1040px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:6px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--blue);text-transform:uppercase}
h1.t{color:var(--navy2);font-size:30px;margin:4px 0 4px;line-height:1.15}
.lead{color:var(--mut);margin:0;max-width:640px}
.timer{background:var(--navy2);color:#fff;border-radius:999px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.timer .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;min-width:54px}
.timer .lab{font-size:11px;opacity:.75}
.timer button{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:999px;width:30px;height:30px;font-size:12px}
.timer.warn{background:var(--amber);color:var(--navy)}
.timer.warn button{background:rgba(10,18,64,.12)}
.timer.over{background:var(--red)}

.stepper{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;margin:14px 0 18px}
.st{display:flex;align-items:center;gap:7px;border:0;background:none;padding:3px 10px 3px 3px;border-radius:999px;color:var(--mut);font-size:12px;white-space:nowrap}
.st .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--line);background:#fff;color:var(--mut)}
.st.cur{color:var(--navy2);font-weight:700}
.st.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.st.done .dot{background:var(--navy2);border-color:var(--navy2);color:#fff}
.st.skip .dot{border:2px dashed var(--amber);color:#8a5a00}
.st.bk .dot{background:#FFF1D6;border-color:var(--amber);color:#8a5a00}
.st.bk.cur .dot{background:var(--amber);color:var(--navy)}
.sep{width:12px;height:2px;background:var(--line);flex:none}

.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px}
.card + .card{margin-top:14px}
.card h3{margin:0 0 4px;color:var(--navy2);font-size:19px}
.card .sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-weight:700;font-size:13px;color:var(--navy2);margin-bottom:6px}
.field .hint{font-weight:400;color:var(--mut)}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:70px;overflow:hidden}
textarea:focus,input:focus,select:focus{outline:3px solid rgba(37,87,214,.2);border-color:var(--blue)}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:700;font-size:14px}
.btn.primary{background:var(--navy2);color:#fff}
.btn.primary:hover{background:var(--blue)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy2)}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn.sm{padding:7px 14px;font-size:13px}
.pill{display:inline-block;background:var(--navy2);color:#fff;border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700;letter-spacing:.03em}
.pill.light{background:#E5EBFA;color:var(--navy2)}
.note{border-left:4px solid var(--amber);background:#FFF8EA;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.note.blue{border-left-color:var(--blue);background:#EEF3FF}
.quote{font-family:Cambria,Georgia,serif;font-size:17px;color:var(--navy2);background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px}

.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav .hintx{font-size:13px;color:var(--mut)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:34px;padding-top:14px;border-top:1px solid var(--line)}
.foot img{height:24px;width:auto}

/* ---------- Seviye 1 ---------- */
.addrow{display:grid;grid-template-columns:1fr 170px auto;gap:10px;margin-bottom:12px}
.srow{display:grid;grid-template-columns:1fr 120px 120px auto auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.srow .nm{font-weight:700;color:var(--navy2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srow select{padding:7px 8px;font-size:13px}
.srow .x{border:0;background:none;font-size:18px;color:var(--mut);padding:0 6px}
.chip{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;margin:3px 4px 3px 0;color:#fff}
.chip.dis{background:var(--blue)}
.chip.ic{background:var(--teal)}
.chip.f{box-shadow:0 0 0 3px var(--amber)}
.tp{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.tp.dis{background:#E3EBFF;color:var(--blue)}
.tp.ic{background:#D9F1EE;color:var(--teal)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:96px}
.q h4{margin:0 0 6px;font-size:12px;color:var(--navy2)}
.q h4 span{display:block;font-weight:400;color:var(--mut)}
.q.qa{background:#EAF0FC;border-color:#B9C8EC}
.q.qr{background:#FCEAEA;border-color:#E3AFAF}
.q.qg{background:#F1F9E4;border-color:#C5DDA1}

/* ---------- Seviye 2 ---------- */
.blk{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.blk .n{width:28px;height:28px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.blk h3{margin:0;flex:1}
.emp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emp .box{background:#fff;border:1px solid var(--line);border-top:5px solid var(--navy2);border-radius:10px;padding:12px}
.emp .box.b2{border-top-color:var(--blue)}
.emp .box.b3{border-top-color:var(--teal)}
.emp .box.b4{border-top-color:var(--sky)}
.emp .box.b5{border-top-color:var(--red)}
.emp .box.b6{border-top-color:var(--amber)}
.emp .box label{display:block;font-weight:700;color:var(--navy2);font-size:14px}
.emp .box small{display:block;color:var(--mut);margin:2px 0 8px;font-size:12.5px}
.emp textarea{min-height:64px}

/* ---------- Mola ---------- */
.brk{background:#FFF1D6;border:2px solid var(--amber);border-radius:14px;padding:34px 24px;text-align:center}
.brk .big{font-family:Cambria,Georgia,serif;font-size:64px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.brk p{margin:10px 0 0;color:#5a4300}

/* ---------- Seviye 5-6 ---------- */
.idea{display:grid;grid-template-columns:1fr;gap:10px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.idea.on{border-color:var(--blue);background:#F5F8FF}
.idea .meta{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.idea .meta label{font-size:13px;display:flex;align-items:center;gap:6px}
.sm5{display:grid;grid-template-columns:44px 1fr;gap:12px;margin-bottom:14px}
.sm5 .L{width:44px;height:44px;border-radius:10px;background:var(--navy2);color:#fff;display:grid;place-items:center;font-family:Cambria,Georgia,serif;font-weight:700;font-size:22px}
.sm5 .L.o{background:var(--sky);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--navy2)}
.chips button:hover{border-color:var(--blue)}
.cb{display:flex;align-items:center;gap:8px;font-size:14px}
.cb input{width:18px;height:18px}

/* ---------- Seviye 7 ---------- */
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum .hd{background:var(--navy2);color:#fff;padding:16px 20px}
.sum .hd .eyebrow{color:var(--sky)}
.sum .hd h2{margin:4px 0 0;font-size:22px}
.sum .bd{padding:6px 20px 18px}
.sum .it{padding:12px 0;border-bottom:1px solid var(--line)}
.sum .it:last-child{border-bottom:0}
.sum .it b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.sum .it p{margin:0;white-space:pre-wrap}
.sum .it .e{color:var(--mut)}
.sum .smart{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;margin-top:6px}
.sum .smart i{font-style:normal;font-family:Cambria,Georgia,serif;font-weight:700;color:#fff;background:var(--navy2);border-radius:6px;text-align:center;height:22px;line-height:22px;font-size:13px}

.ex ul{margin:6px 0 0;padding-left:18px}
.ex li{margin-bottom:4px}
.ex b{color:var(--navy2)}
details.ref{padding:14px 18px}
details.ref summary{cursor:pointer;font-weight:700;color:var(--navy2);font-family:Cambria,Georgia,serif;font-size:17px}
details.ref summary .hint{font-family:Arial,sans-serif;font-size:12px;font-weight:400;color:var(--mut)}
.refgrid{display:grid;grid-template-columns:44px 1fr 1fr;grid-template-rows:84px 84px auto;gap:8px;margin:12px 0 8px;max-width:560px}
.refgrid .qq{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.refgrid .qq b{color:var(--navy2);font-size:14px}
.refgrid .qq i{color:var(--mut);font-size:12px}
.refgrid .qq.hot{border-color:var(--blue);background:#F5F8FF}
.refgrid .yl{grid-row:1/3;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;color:var(--navy2)}
.refgrid .xl{grid-column:2/4;text-align:center;font-size:12px;font-weight:700;color:var(--navy2)}
.defs{font-size:13.5px;margin:6px 0 0}
.vis{overflow-x:auto}
.vis svg{display:block;min-width:560px;width:100%;height:auto}
.e3b{background:#fff;border:1px solid var(--line);border-top:5px solid var(--navy2);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.e3b.b2{border-top-color:var(--blue)}
.e3b.b6{border-top-color:var(--amber)}
.e3b>label{display:block;font-weight:700;color:var(--navy2);font-size:15px;margin-bottom:8px}
.e3b .field label{font-weight:400;color:var(--ink);font-size:13px}
@media (max-width:760px){
  .cover h1{font-size:32px}
  h1.t{font-size:24px}
  .grid2,.emp,.mx{grid-template-columns:1fr}
  .emp .box.b5{grid-column:auto}
  .addrow{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr}
  .srow .nm{grid-column:1/-1}
  .top{flex-direction:column}
  .st .lb{display:none}
  .st.cur .lb{display:inline}
  .idea .meta{grid-template-columns:1fr}
}
@media print{
  .no-print{display:none !important}
  body{background:#fff}
  .shell{padding:0;max-width:none}
  .sum{border:0}
  .sum .hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

/* ---------- Durum ---------- */
function fresh(){return {
  cur:0, stakes:[], focus:null, roomName:"",
  map:{duyar:"",gorur:"",dusunur:"",soyler:"",zorluk:"",kazanim:""}, pain:"",
  share:{notes:"",chosen:""}, topic:"",
  moment:{type:null,what:""},
  problem:{who:"",why:"",what:"",link:""},
  ideas:[{t:"",own:false,res:"",other:""},{t:"",own:false,res:"",other:""},{t:"",own:false,res:"",other:""}], pick:-1,
  card:{idea:"",m:"",md:"",aSel:"",r:"",t:"",friends:""},
  e3:{who:"",ess:"",essA:"",ena:"",enaA:"",ene:"",eneA:"",pick:""},
  status:{}, timers:{}
}}
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign(fresh(),JSON.parse(r)):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S = load() || fresh();
let running = false, tick = 0;

/* ---------- Yardımcılar ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const getp = p => p.split(".").reduce((o,k)=>o==null?o:o[k],S);
function setp(p,v){const ks=p.split(".");const last=ks.pop();ks.reduce((o,k)=>o[k],S)[last]=v}
function grow(el){if(el.tagName==="TEXTAREA"){el.style.height="auto";el.style.height=(el.scrollHeight+2)+"px"}}
function wire(root){
  root.querySelectorAll("[data-bind]").forEach(el=>{
    const p=el.dataset.bind, v=getp(p);
    if(el.type==="checkbox"){
      el.checked=!!v;
      el.addEventListener("change",()=>{setp(p,el.checked);save()});
    }else{
      el.value=v==null?"":v;
      el.addEventListener("input",()=>{setp(p,el.value);save();grow(el)});
      el.addEventListener("change",()=>{setp(p,el.value);save()});
      grow(el);
    }
  });
}
const typeLabel = t => t==="ic" ? "İç müşteri" : "Dış müşteri";
function focusObj(){
  const f=S.stakes.find(x=>x.id===S.focus);
  return f || {name:"", type:"dis", none:true};
}

/* ---------- Süre ---------- */
const stepNow = () => STEPS[S.cur];
function rem(){const st=stepNow();if(!st.min)return 0;if(S.timers[st.id]==null)S.timers[st.id]=st.min*60;return S.timers[st.id]}
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function paintTimer(){
  const el=$("#timer"); if(!el) return;
  const r=rem();
  el.classList.toggle("warn", r>0 && r<=60);
  el.classList.toggle("over", r===0);
  $("#tm").textContent = r===0 ? "Süre doldu" : fmt(r);
  $("#tgl").textContent = running ? "❚❚" : "▶";
  const big=$("#bigtm"); if(big) big.textContent = r===0 ? "00:00" : fmt(r);
}
setInterval(()=>{
  if(!running) return;
  const st=stepNow(); if(!st.min) return;
  if(rem()>0) S.timers[st.id]--;
  if(rem()<=0) running=false;
  tick++; if(tick%5===0) save();
  paintTimer();
},1000);
function toggleTimer(){if(rem()>0){running=!running} paintTimer()}
function resetTimer(){running=false;S.timers[stepNow().id]=stepNow().min*60;save();paintTimer()}

/* ---------- Gezinme ---------- */
function go(i){
  running=false;
  S.cur=Math.max(0,Math.min(STEPS.length-1,i));
  enter(STEPS[S.cur].id);
  save(); render(); window.scrollTo({top:0});
}
function next(done){const id=stepNow().id;if(id!=="intro")S.status[id]=done?"done":"skip";go(S.cur+1)}
function enter(id){
  const f=focusObj();
  if(id==="l2" && !S.roomName && f.name) S.roomName = f.name;
  if(id==="l4" && !S.moment.type) S.moment.type = f.type;
  if(id==="bonus" && !S.e3.who) S.e3.who = S.roomName || f.name || "";
  if(id==="l6" && S.pick>=0){
    const it=S.ideas[S.pick];
    if(!S.card.idea) S.card.idea = it.t;
    if(!S.card.aSet){if(it.own) S.card.aSel="evet"; S.card.aSet=true}
    if(!S.card.r && S.moment.what) S.card.r = S.moment.what;
  }
}

/* ---------- Ortak parçalar ---------- */
function stepperHTML(){
  let h="";
  STEPS.forEach((s,i)=>{
    if(s.id==="intro") return;
    const st=S.status[s.id];
    const cls=["st", i===S.cur?"cur":"", st==="done"?"done":"", st==="skip"?"skip":"", (s.id==="brk"||s.id==="bonus")?"bk":""].join(" ");
    const dot = s.id==="brk" ? "☕" : s.id==="bonus" ? "★" : (st==="done" && i!==S.cur ? "✓" : s.n);
    if(i>1) h+='<span class="sep"></span>';
    h+=`<button class="${cls}" data-go="${i}" title="${esc(s.title)}"><span class="dot">${dot}</span><span class="lb">${esc(s.title)}</span></button>`;
  });
  return h;
}
function timerHTML(){
  const st=stepNow();
  return `<div class="timer no-print" id="timer"><span class="lab">Süre</span><span class="tm" id="tm">${fmt(rem())}</span>
  <button id="tgl" title="Başlat / duraklat">▶</button><button id="rst" title="Sıfırla">↺</button></div>`;
}

function drawStake(){
  const L=$("#sList"); if(!L) return;
  if(!S.stakes.length){L.innerHTML='<p class="sub" style="margin:0">Henüz kimse eklenmedi.</p>';drawMatrix();return}
  L.innerHTML=S.stakes.map(s=>`
    <div class="srow" data-id="${s.id}">
      <div class="nm">${esc(s.name)} <span class="tp ${s.type}">${typeLabel(s.type)}</span></div>
      <select data-f="etki"><option value="">Etki…</option><option value="h"${s.etki==="h"?" selected":""}>Etki: yüksek</option><option value="l"${s.etki==="l"?" selected":""}>Etki: düşük</option></select>
      <select data-f="ilgi"><option value="">İlgi…</option><option value="h"${s.ilgi==="h"?" selected":""}>İlgi: yüksek</option><option value="l"${s.ilgi==="l"?" selected":""}>İlgi: düşük</option></select>
      <button class="btn sm ${S.focus===s.id?"amber":"ghost"}" data-focus="${s.id}">${S.focus===s.id?"★ Odak":"Odak yap"}</button>
      <button class="x" data-del="${s.id}" title="Sil">×</button>
    </div>`).join("");
  drawMatrix();
}
function drawMatrix(){
  const M=$("#sMx"); if(!M) return;
  const Q=[["h","l","Yüksek etki · düşük ilgi","Memnun tut","qa"],["h","h","Yüksek etki · yüksek ilgi","Yakından çalış","qr"],["l","l","Düşük etki · düşük ilgi","İzle","qg"],["l","h","Düşük etki · yüksek ilgi","Bilgilendir","qa"]];
  const chip=s=>`<span class="chip ${s.type}${S.focus===s.id?" f":""}">${esc(s.name)}</span>`;
  let h=(S.stakes.length>=3 && S.stakes.every(s=>s.etki==="h"&&s.ilgi==="h")) ? '<div class="note">Hepsi yüksek etki ve yüksek ilgi görünüyor. Gerçekten hepsi mi? Kimin etkisi ya da ilgisi diğerlerinden daha düşük?</div>' : "";
  h+='<div class="mx">';
  Q.forEach(q=>{
    const items=S.stakes.filter(s=>s.etki===q[0]&&s.ilgi===q[1]);
    h+=`<div class="q ${q[4]}"><h4>${q[3]}<span>${q[2]}</span></h4>${items.map(chip).join("")}</div>`;
  });
  h+="</div>";
  const un=S.stakes.filter(s=>!s.etki||!s.ilgi);
  if(un.length) h+=`<p class="sub" style="margin:12px 0 4px">Henüz yerleşmedi:</p>${un.map(chip).join("")}`;
  M.innerHTML=h;
}
function initL1(){
  const add=()=>{
    const n=$("#sName").value.trim(); if(!n) return;
    S.stakes.push({id:"p"+Date.now()+Math.floor(Math.random()*99),name:n,type:$("#sType").value,etki:"",ilgi:""});
    $("#sName").value=""; save(); drawStake(); $("#sName").focus();
  };
  $("#sAdd").onclick=add;
  $("#sName").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
  $("#sList").addEventListener("change",e=>{
    const row=e.target.closest(".srow"); if(!row||!e.target.dataset.f) return;
    const s=S.stakes.find(x=>x.id===row.dataset.id); s[e.target.dataset.f]=e.target.value; save(); drawMatrix();
  });
  $("#sList").addEventListener("click",e=>{
    const f=e.target.closest("[data-focus]"), d=e.target.closest("[data-del]");
    if(f){S.focus = S.focus===f.dataset.focus ? null : f.dataset.focus; save(); drawStake()}
    if(d){S.stakes=S.stakes.filter(x=>x.id!==d.dataset.del); if(S.focus===d.dataset.del) S.focus=null; save(); drawStake()}
  });
  drawStake();
}

const RES = ["Pusula","Müşteri tutundurma","Hız","Müşteri memnuniyeti","Çalışan memnuniyeti","İş birliği","Diğer"];
function resLabel(){
  if(S.pick<0) return "";
  const it=S.ideas[S.pick];
  return it.res==="Diğer" ? (it.other||"Diğer") : it.res;
}

function sumData(){
  const f=focusObj(), m=S.moment, c=S.card, e=S.e3;
  const A={evet:"Evet, tamamen",kismen:"Kısmen",hayir:"Hayır"};
  const smart=[["S",c.idea],["M",(c.m||"")+(c.md?" ("+c.md+")":"")],["A",A[c.aSel]||""],["R",c.r],["T",c.t]];
  const out=[
    ["Paydaş", S.roomName||f.name||""],
    ["Üzerinde çalıştığım sorun", S.topic],
    ["Yaşanan an", m.what?typeLabel(m.type)+": "+m.what:""]
  ];
  if(S.problem.link) out.push(["Müşteriye yansıması", S.problem.link]);
  out.push(["Küçük deney", smart]);
  out.push(["Etkilediği başlık", resLabel()]);
  out.push(["Arkadaşlarımdan aldığım fikirler", c.friends]);
  if(e.ess||e.essA||e.ena||e.enaA||e.ene||e.eneA){
    const L=(n,a,b)=>n+" · müşteri: "+(a||"—")+" | biz: "+(b||"—");
    out.push(["Bonus · müşteri beklentisini aşmak", [L("Temel",e.ess,e.essA),L("Mümkün kılanlar",e.ena,e.enaA),L("Heyecanlandıranlar",e.ene,e.eneA)].join("\n")]);
  }
  return out;
}
function sumBody(){
  return sumData().map(([k,v])=>{
    if(Array.isArray(v)){
      return `<div class="it"><b>${k}</b><div class="smart">${v.map(([l,t])=>`<i>${l}</i><span>${t&&t.trim()?esc(t):'<span class="e">—</span>'}</span>`).join("")}</div></div>`;
    }
    return `<div class="it"><b>${k}</b><p>${v&&v.trim()?esc(v):'<span class="e">—</span>'}</p></div>`;
  }).join("");
}
function drawSum(){const b=$("#sum .bd"); if(b) b.innerHTML=sumBody()}

    if(Array.isArray(v)) return k.toLocaleUpperCase("tr")+"\n"+v.map(([l,t])=>l+": "+(t&&t.trim()?t:"—")).join("\n");
    return k.toLocaleUpperCase("tr")+"\n"+(v&&v.trim()?v:"—");
  }).join("\n\n");

/* ---------- Kapak ve ana çizim ---------- */
function coverHTML(){
  const started = S.cur>0 || Object.keys(S.status).length>0;
  return `<section class="cover"><div class="in">
    <div class="eyebrow">Strong Gelişim Programı</div>
    <h1>GÜN 3 — SAHA: Müşteri Önceliği Atölyesi</h1>
    <p class="lead">Bir paydaşı anla, sınıfla en büyük sıkıntıyı belirle ve bu hafta deneyebileceğin küçük bir adım tasarla.</p>
    <div class="row">
      <span class="tag">Empati kartları · 20 dk</span>
      <span class="tag">1. Bölüm · Anla · 65 dk</span>
      <span class="tag m">Mola · 15 dk</span>
      <span class="tag">2. Bölüm · Netleştir ve Dene · 60 dk</span>
      <span class="tag">Bonus · isteğe bağlı</span>
    </div>
    <button class="btn primary" style="background:var(--blue);padding:13px 30px;font-size:15px" data-go="${IDX.l1}">Başla →</button>
    ${started?`<button class="btn ghost" style="margin-left:10px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)" data-go="${Math.max(1,S.cur)}">Kaldığım yerden devam et</button>`:""}
    <p class="priv">Çalışman bu cihazda saklanır, başka kimseye gönderilmez. Gerçek müşteri adı, hesap bilgisi ya da kişisel veri yazma.</p>
  </div>
  <div class="logos"><img src="${LOGO_GW}" alt="Garanti BBVA"><img src="${LOGO_MW}" alt="MCT Management Centre Türkiye"></div></section>`;
}

function render(){
  const app=$("#app"), st=stepNow();
  if(st.id==="intro"){app.innerHTML=coverHTML();bindGo(app);return}
  const last = S.cur===STEPS.length-1;
  const phLab = st.id==="brk" ? "Mola" : st.id==="bonus" ? "Bonus · isteğe bağlı" : `Seviye ${st.n} / 7 · ${st.ph}`;
  app.innerHTML=`<div class="shell">
    <div class="top"><div><div class="eyebrow">${esc(phLab)}</div><h1 class="t">${esc(st.title)}</h1><p class="lead">${esc(st.lead)}</p></div>${timerHTML()}</div>
    <div class="stepper no-print">${stepperHTML()}</div>
    <div id="body">${screens[st.id]()}</div>
    <div class="nav no-print">
      <button class="btn ghost" data-go="${S.cur-1}">← Geri</button>
      <div class="r">
        <span class="hintx" id="hintx"></span>
        ${last?"":st.id==="l7"?`<button class="btn ghost" id="nx">Bonus çalışma →</button>`:`<button class="btn ghost" id="skip">Atla, sonra tamamlarım</button><button class="btn primary" id="nx">Devam →</button>`}
      </div>
    </div>
    ${LOGOS}
  </div>`;
  const body=$("#body"); wire(body); bindGo(app);
  body.querySelectorAll("[data-chips]").forEach(w=>{const p=w.dataset.chips;const ta=body.querySelector('[data-bind="'+p+'"]');
    w.querySelectorAll("button").forEach(b=>b.onclick=()=>{const v=ta.value.trim();ta.value=v?v+", "+b.textContent:b.textContent;setp(p,ta.value);save();grow(ta)})});
  $("#tgl").onclick=toggleTimer; $("#rst").onclick=resetTimer; paintTimer();
  if(!last){
    $("#nx").onclick=()=>{ if(st.id==="l1" && S.stakes.length && !S.focus){$("#hintx").textContent="İstersen önce bir paydaşı “Odak yap”."; if(!S._h){S._h=1;return}} next(true)};
    if($("#skip")) $("#skip").onclick=()=>next(false);
  }
  if(st.id==="l1") initL1();
  if(st.id==="brk"){$("#bigStart").onclick=()=>{running=true;paintTimer()}}
  if(st.id==="l4"){
    const tg=()=>{$("#linkBox").style.display=S.moment.type==="ic"?"":"none"}; tg();
    body.querySelector('[data-bind="moment.type"]').addEventListener("change",tg);
  }
  if(st.id==="l5"){const tgo=sel=>{sel.closest(".idea").querySelector(".oth").style.display=sel.value==="Diğer"?"":"none"};body.querySelectorAll("select[data-res]").forEach(x=>{tgo(x);x.addEventListener("change",()=>tgo(x))});body.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    S.pick=+b.dataset.pick; save();
    body.querySelectorAll("[data-pick]").forEach(x=>{const on=+x.dataset.pick===S.pick;x.textContent=on?"✓ Seçildi":"Bunu seç";x.className="btn sm "+(on?"primary":"ghost");$("#idea"+x.dataset.pick).classList.toggle("on",on)});
  })}
  if(st.id==="bonus"){
    $("#toCard").onclick=()=>{
      const t=S.e3[S.e3.pick]||""; const m=$("#toMsg");
      if(!t||!t.trim()){m.textContent="Önce seçtiğin kutunun “biz” kısmına bir cevap yaz.";return}
      if(!S.card.idea) S.card.idea=t.trim();
      else if(!S.card.idea.includes(t.trim())) S.card.idea=S.card.idea.trim()+" / "+t.trim();
      save(); m.textContent="Seviye 6’daki fikir kartına eklendi ✓";
    };
  }
  if(st.id==="l7"){
    $("#cp").onclick=async()=>{
      const t=sumText(); let ok=false;
      try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
      if(!ok){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{ok=document.execCommand("copy")}catch(e){}ta.remove()}
      $("#msg").textContent=ok?"Kopyalandı ✓":"Kopyalanamadı, metni elle seçip kopyala.";
    };
    $("#pr").onclick=()=>window.print(); $("#fr").addEventListener("input",drawSum);
    let armed=false;
    $("#rs").onclick=()=>{
      if(!armed){armed=true;$("#rs").textContent="Emin misin? Tekrar tıkla";return}
      S=fresh();save();go(0);
    };
  }
}
function bindGo(root){root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go))}

render();
</script>
